<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Full Count</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap">
<style>
:root {
  --bg: #07101f;
  --panel: #0f1b30;
  --panel2: #16253f;
  --line: #2a3d60;
  --text: #eef4ff;
  --dim: #9fb2d0;
  --gold: #ffc940;
  --good: #4ade80;
  --bad: #f87171;
  --blue: #60a5fa;
  --padW: clamp(250px, 26vw, 400px);
  --padH: 40vh;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Nunito, system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; user-select: text; -webkit-user-select: text; }
[hidden] { display: none !important; }
.bungee { font-family: Bungee, Nunito, sans-serif; letter-spacing: 1px; }

/* ---------- layout: field view + keypad */
#view { position: fixed; left: 0; top: 0; right: var(--padW); bottom: 0; overflow: hidden; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#pad { position: fixed; right: 0; top: 0; bottom: 0; width: var(--padW); z-index: 4; background: linear-gradient(160deg, #13223b, #0a1424); border-left: 2px solid var(--line); display: flex; align-items: center; justify-content: center; padding: 18px; }
@media (orientation: portrait) {
  #view { right: 0; bottom: var(--padH); }
  #pad { top: auto; left: 0; width: auto; height: var(--padH); border-left: 0; border-top: 2px solid var(--line); }
}
#keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 360px; }
#keys button { aspect-ratio: 1.2; border-radius: 16px; border: 2px solid #3b5584; background: linear-gradient(#22365a, #172642); font-size: clamp(26px, 4vmin, 44px); font-weight: 900; box-shadow: 0 5px 0 #050b16, inset 0 1px 0 #ffffff22; transition: transform .05s; }
#keys button:active, #keys button.press { transform: translateY(4px); box-shadow: 0 1px 0 #050b16; }
#keys .del { background: linear-gradient(#5a2d3a, #3a1c26); border-color: #a85068; font-size: clamp(20px, 3.2vmin, 34px); }
#keys .neg { background: linear-gradient(#2d3a5a, #1c2540); border-color: #5a78b8; }
#keys .take { aspect-ratio: auto; padding: 14px 0; background: linear-gradient(#24507e, #183a5e); border-color: var(--blue); font-size: clamp(18px, 2.6vmin, 26px); }
#keys .swing { grid-column: span 2; aspect-ratio: auto; padding: 14px 0; background: linear-gradient(#2f9e5a, #1e6e3d); border-color: var(--good); font-size: clamp(20px, 2.8vmin, 30px); }
#keys .take[hidden] + .swing { grid-column: 1 / -1; }
#keys small { display: block; font-size: 12px; font-weight: 800; opacity: .7; letter-spacing: .5px; }
#pad.off #keys { opacity: .35; pointer-events: none; }

/* ---------- HUD */
#hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; align-items: flex-start; gap: 10px; z-index: 5; pointer-events: none; }
#hud .spacer { flex: 1; }
#board { display: flex; gap: 12px; align-items: center; background: #050a14e6; border: 2px solid var(--line); border-radius: 14px; padding: 8px 14px; font-weight: 900; }
#board table { border-collapse: collapse; font-size: 20px; }
#board td { padding: 0 6px; }
#board td.r { font-family: Bungee, sans-serif; color: var(--gold); text-align: right; min-width: 34px; }
#board .inn { font-size: 22px; text-align: center; min-width: 50px; }
#board .count { font-size: 15px; line-height: 1.5; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #ffffff55; margin-left: 3px; vertical-align: -1px; }
.dot.b { background: #4ade80; border-color: #4ade80; }
.dot.s { background: #fbbf24; border-color: #fbbf24; }
.dot.o { background: #f87171; border-color: #f87171; }
#hudBtns { display: flex; gap: 8px; pointer-events: auto; }
#hudBtns button { background: #050a14e6; border: 2px solid var(--line); border-radius: 12px; width: 48px; height: 44px; font-size: 20px; }

/* ---------- question card */
#qcard { position: absolute; left: 50%; transform: translateX(-50%); top: 12px; z-index: 5; width: min(760px, calc(100% - 24px)); background: #08111fef; border: 2px solid var(--line); border-radius: 22px; padding: 12px 18px 14px; box-shadow: 0 10px 40px #000a; display: flex; gap: 16px; align-items: center; }
#zone { flex: 0 0 auto; }
#qmain { flex: 1; min-width: 0; text-align: center; }
#qtag { font-size: 16px; font-weight: 800; color: var(--dim); min-height: 22px; }
#qrow { display: flex; align-items: baseline; justify-content: center; gap: 14px; flex-wrap: wrap; }
#qtext { font-size: clamp(30px, 5.2vmin, 58px); font-weight: 900; }
#qtext.word { font-size: clamp(20px, 3vmin, 30px); line-height: 1.25; font-weight: 800; }
#answer { min-width: 2.2em; font-size: clamp(34px, 5.6vmin, 60px); font-weight: 900; color: var(--gold); border-bottom: 5px solid var(--gold); padding: 0 8px; line-height: 1.1; }
#answer.ph { color: #ffc94055; }
#qdef { margin-top: 6px; font-size: clamp(15px, 2vmin, 19px); font-weight: 800; color: #93c5fd; }
#clock { height: 10px; border-radius: 6px; background: #ffffff14; margin-top: 10px; overflow: hidden; }
#clockFill { height: 100%; width: 100%; background: var(--good); border-radius: 6px; }
#qcard.shake { animation: shake .3s; }
@keyframes shake { 0%, 100% { transform: translateX(-50%); } 25% { transform: translateX(calc(-50% - 10px)); } 75% { transform: translateX(calc(-50% + 10px)); } }

/* ---------- banner */
#banner { position: absolute; left: 0; right: 0; top: 24%; z-index: 6; text-align: center; pointer-events: none; }
#banner .big { font-family: Bungee, sans-serif; font-size: clamp(44px, 9vmin, 110px); color: #fff; text-shadow: 0 4px 0 #0008, 0 0 30px var(--bc, #60a5fa); }
#banner .sub { font-size: clamp(18px, 3vmin, 30px); font-weight: 900; color: #fff; text-shadow: 0 2px 6px #000; margin-top: 4px; }
#banner.pop { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------- screens */
.screen { position: fixed; inset: 0; z-index: 20; background: radial-gradient(ellipse at 50% 0%, #17305a, #07101f 70%); display: flex; align-items: center; justify-content: center; padding: 20px; overflow: auto; }
.box { width: min(980px, 100%); max-height: 100%; }
.logo { font-family: Bungee, sans-serif; font-size: clamp(54px, 10vmin, 112px); margin: 0; text-align: center; line-height: 1; color: #fff; text-shadow: 0 6px 0 #b91c1c, 0 0 40px #60a5fa66; }
.logo small { display: block; font-family: Nunito, sans-serif; font-weight: 900; font-size: 18px; letter-spacing: 6px; color: var(--dim); text-shadow: none; margin-top: 10px; }
h2 { font-family: Bungee, sans-serif; font-weight: 400; margin: 0 0 14px; font-size: 34px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn { background: linear-gradient(#22365a, #172642); border: 2px solid #3b5584; border-radius: 16px; padding: 14px 20px; font-size: 22px; font-weight: 900; box-shadow: 0 4px 0 #050b16; }
.btn:hover { border-color: #6b8fd0; }
.btn.go { background: linear-gradient(#2f9e5a, #1e6e3d); border-color: var(--good); }
.btn.red { background: linear-gradient(#b91c1c, #7f1d1d); border-color: #f87171; }
.btn.sm { padding: 8px 14px; font-size: 17px; border-radius: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.big-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 14px; font-size: 24px; }
.big-btn .e { font-size: 44px; }
.big-btn .d { font-size: 15px; font-weight: 800; color: var(--dim); }
.card { background: #0d1a2ecc; border: 2px solid var(--line); border-radius: 18px; padding: 16px; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin: 18px 0; gap: 12px; flex-wrap: wrap; }
.chip { background: #0d1a2e; border: 2px solid var(--line); border-radius: 999px; padding: 8px 16px; font-weight: 900; font-size: 20px; }
.passbar { flex: 1; min-width: 260px; }
.passbar .lbl { display: flex; justify-content: space-between; font-weight: 900; font-size: 17px; margin-bottom: 6px; }
.bar { height: 16px; background: #ffffff14; border-radius: 9px; overflow: hidden; border: 1px solid var(--line); }
.bar > div { height: 100%; background: linear-gradient(90deg, #f59e0b, #ffc940); }
.daily { margin-top: 16px; }
.daily h3, .card h3 { margin: 0 0 10px; font-size: 18px; letter-spacing: 1px; color: var(--dim); }
.ch { display: flex; align-items: center; gap: 12px; padding: 6px 0; font-weight: 800; font-size: 18px; }
.ch .p { margin-left: auto; color: var(--dim); }
.ch.done { color: var(--good); }
.league { text-align: left; padding: 16px; }
.league b { display: block; font-size: 22px; }
.league span { font-size: 15px; color: var(--dim); font-weight: 800; }
.league.sel, .opt.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset, 0 4px 0 #050b16; }
table.stats { width: 100%; border-collapse: collapse; font-size: 18px; font-weight: 800; }
table.stats th { text-align: left; color: var(--dim); font-size: 14px; letter-spacing: 1px; padding: 6px 8px; border-bottom: 2px solid var(--line); }
table.stats td { padding: 8px; border-bottom: 1px solid #ffffff10; }
table.stats td.n, table.stats th.n { text-align: right; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
.item { padding: 12px; text-align: center; font-size: 16px; }
.item .sw { width: 100%; height: 34px; border-radius: 10px; margin-bottom: 8px; border: 2px solid #ffffff30; }
.item.locked { opacity: .45; }
.item.eq { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
.res-line { font-size: 22px; font-weight: 900; text-align: center; margin: 6px 0; }
.list-row { display: flex; align-items: center; gap: 10px; }
#nameIn { background: #050a14; border: 2px solid var(--line); border-radius: 12px; color: var(--text); padding: 12px 14px; font-size: 22px; font-weight: 800; width: 260px; }
</style>
</head>
<body>

<div id="view">
  <canvas id="scene"></canvas>
  <div id="hud" hidden>
    <div id="board"></div>
    <div class="spacer"></div>
    <div id="hudBtns"><button id="muteBtn" title="Sound">🔊</button><button id="pauseBtn" title="Pause">⏸</button></div>
  </div>
  <div id="banner" hidden><div class="big"></div><div class="sub"></div></div>
  <div id="qcard" hidden>
    <svg id="zone" width="96" height="126" viewBox="0 0 64 84"></svg>
    <div id="qmain">
      <div id="qtag"></div>
      <div id="qrow"><span id="qtext"></span><span id="answer" class="ph">?</span></div>
      <div id="qdef" hidden></div>
      <div id="clock"><div id="clockFill"></div></div>
    </div>
  </div>
</div>

<div id="pad" class="off">
  <div id="keys">
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="-" class="neg">±</button><button data-k="0">0</button><button data-k="del" class="del">⌫</button>
    <button data-k="take" class="take">TAKE<small>T key</small></button><button data-k="go" class="swing" id="goBtn">SWING ✓<small>ENTER</small></button>
  </div>
</div>

<!-- screens -->
<div class="screen" id="sMenu" hidden><div class="box">
  <h1 class="logo">FULL COUNT<small>MATH IS YOUR BAT SPEED</small></h1>
  <div class="top-bar">
    <button class="chip" id="whoBtn"></button>
    <div class="passbar" id="pass"></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
    <button class="btn big-btn go" id="playBtn"><span class="e">⚾</span>Play Ball<span class="d">Bat, field, win the game</span></button>
    <button class="btn big-btn" id="derbyBtn"><span class="e">💥</span>Home Run Derby<span class="d">10 outs. Go deep.</span></button>
    <button class="btn big-btn" id="lockerBtn"><span class="e">🧢</span>Locker<span class="d">Bats, jerseys, HR fireworks</span></button>
    <button class="btn big-btn" id="statsBtn"><span class="e">📊</span>Stats<span class="d">Your real batting line</span></button>
    <button class="btn big-btn" id="flexBtn"><span class="e">🏆</span>Flex Board<span class="d">Who's the best on this device</span></button>
  </div>
  <div class="card daily" id="daily"></div>
</div></div>

<div class="screen" id="sPlayers" hidden><div class="box" style="width:min(560px,100%)">
  <h2>Who's up?</h2>
  <div id="plist" class="grid" style="grid-template-columns:1fr"></div>
  <div class="row" style="margin-top:18px">
    <input id="nameIn" maxlength="14" placeholder="New player name" autocomplete="off">
    <button class="btn go" id="addBtn">Add</button>
  </div>
</div></div>

<div class="screen" id="sSetup" hidden><div class="box">
  <h2 id="setupTitle">Pick your league</h2>
  <div class="grid" id="leagues" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"></div>
  <div id="innRow" class="row" style="margin-top:18px">
    <b style="font-size:20px">Innings:</b>
    <button class="btn sm opt" data-inn="3">3</button><button class="btn sm opt" data-inn="6">6</button><button class="btn sm opt" data-inn="9">9</button>
  </div>
  <div class="row" style="margin-top:22px">
    <button class="btn" data-back>← Back</button>
    <button class="btn go" id="startBtn" style="font-size:26px;padding:16px 40px">PLAY BALL</button>
  </div>
</div></div>

<div class="screen" id="sLocker" hidden><div class="box">
  <div class="row" style="justify-content:space-between"><h2>Locker</h2><button class="btn sm" data-back>← Back</button></div>
  <div id="lockerBody"></div>
</div></div>

<div class="screen" id="sStats" hidden><div class="box">
  <div class="row" style="justify-content:space-between"><h2>Stats</h2><button class="btn sm" data-back>← Back</button></div>
  <div id="statsBody"></div>
</div></div>

<div class="screen" id="sFlex" hidden><div class="box">
  <div class="row" style="justify-content:space-between"><h2>Flex Board</h2><button class="btn sm" data-back>← Back</button></div>
  <div id="flexBody"></div>
</div></div>

<div class="screen" id="sResult" hidden><div class="box" style="width:min(720px,100%)">
  <div id="resBody"></div>
  <div class="row" style="justify-content:center;margin-top:20px">
    <button class="btn" data-back>Menu</button>
    <button class="btn go" id="againBtn">Run it back</button>
  </div>
</div></div>

<div class="screen" id="sPause" hidden><div class="box" style="width:min(460px,100%);text-align:center">
  <h2>Timeout</h2>
  <div class="row" style="justify-content:center">
    <button class="btn red" id="quitBtn">Quit game</button>
    <button class="btn go" id="resumeBtn">Resume</button>
  </div>
</div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const D2R = Math.PI / 180;
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const nz = (a, b) => { let v; do v = rint(a, b); while (v === 0); return v; };
const neg = n => n < 0 ? `−${-n}` : `${n}`;
const par = n => n < 0 ? `(−${-n})` : `${n}`;
const signed = n => n < 0 ? ` − ${-n}` : ` + ${n}`;
const QS = new URLSearchParams(location.search), DEBUG = QS.has("debug");
const SPEED = DEBUG ? Number(QS.get("speed") || 1) : 1;

/* =====================================================================
   Math: every skill returns { text, answer, kind }. Answers are integers.
   kind sets the pitch clock: arith < eq < word.
   ===================================================================== */
const SKILLS = {
  add: { name: "Add & subtract", kind: "arith", gen() {
    const a = rint(12, 89), b = rint(11, 79);
    return Math.random() < 0.5 ? { text: `${a} + ${b}`, answer: a + b } : { text: `${Math.max(a, b)} − ${Math.min(a, b)}`, answer: Math.abs(a - b) };
  } },
  times: { name: "Times tables", kind: "arith", gen() {
    const a = rint(2, 12), b = rint(2, 12);
    return Math.random() < 0.6 ? { text: `${a} × ${b}`, answer: a * b } : { text: `${a * b} ÷ ${a}`, answer: b };
  } },
  missing: { name: "Missing number", kind: "eq", gen() {
    if (Math.random() < 0.5) { const x = rint(2, 20), a = rint(2, 20); return { text: `? + ${a} = ${x + a}`, answer: x, v: "?" }; }
    const a = rint(2, 9), x = rint(2, 10); return { text: `${a} × ? = ${a * x}`, answer: x, v: "?" };
  } },
  innings: { name: "Baseball counting", kind: "word", gen() {
    const t = rint(0, 2), n = rint(2, 9);
    if (t === 0) return { text: `3 outs an inning. How many outs in ${n} innings?`, answer: 3 * n };
    if (t === 1) { const r = rint(1, 6), m = rint(1, 6); return { text: `Your team has ${r} runs and scores ${m} more. Total runs?`, answer: r + m }; }
    const h = rint(1, 3), d = rint(1, 2); return { text: `${h} single${h > 1 ? "s" : ""} and ${d} double${d === 1 ? "" : "s"}. Total bases?`, answer: h + 2 * d, def: "A single = 1 base, a double = 2 bases" };
  } },
  neg: { name: "Negatives", kind: "arith", gen() {
    const a = nz(-30, 30), b = nz(-30, 30);
    return Math.random() < 0.5 ? { text: `${neg(a)} + ${par(b)}`, answer: a + b } : { text: `${neg(a)} − ${par(b)}`, answer: a - b };
  } },
  negmul: { name: "Negative × ÷", kind: "arith", gen() {
    const a = nz(-12, 12), b = nz(-12, 12);
    return Math.random() < 0.5 ? { text: `${par(a)} × ${par(b)}`, answer: a * b } : { text: `${neg(a * b)} ÷ ${par(b)}`, answer: a };
  } },
  ops: { name: "Order of ops", kind: "arith", gen(lvl) {
    const t = rint(0, lvl === 0 ? 1 : 3);
    if (t === 0) { const a = rint(2, 20), b = rint(2, 9), c = rint(2, 9); return { text: `${a} + ${b} × ${c}`, answer: a + b * c }; }
    if (t === 1) { const a = rint(2, 9), b = rint(1, 9), c = rint(2, 6), d = rint(1, 15); return { text: `(${a} + ${b}) × ${c} − ${d}`, answer: (a + b) * c - d }; }
    if (t === 2) { const a = rint(4, 12), b = rint(2, 9), c = rint(2, 9); return { text: `${a}² − ${b} × ${c}`, answer: a * a - b * c }; }
    const a = rint(2, 5), b = rint(4, 9), c = rint(1, b - 1); return { text: `${a} × (${b} − ${c})²`, answer: a * (b - c) ** 2 };
  } },
  sq: { name: "Powers & roots", kind: "arith", gen(lvl) {
    const t = rint(0, lvl === 0 ? 1 : 3);
    if (t === 0) { const n = rint(lvl === 0 ? 4 : 11, lvl === 0 ? 12 : 25); return { text: `${n}²`, answer: n * n }; }
    if (t === 1) { const n = rint(lvl === 0 ? 3 : 8, lvl === 0 ? 12 : 25); return { text: `√${n * n}`, answer: n }; }
    if (t === 2) { const n = rint(2, 6); return { text: `${n}³`, answer: n ** 3 }; }
    const n = rint(3, 10); return { text: `2^${n}`, answer: 2 ** n };
  } },
  one: { name: "One-step equations", kind: "eq", gen(lvl) {
    const x = lvl === 0 ? rint(2, 25) : nz(-20, 25), a = rint(2, 12), t = rint(0, 3);
    if (t === 0) { const b = x + a; return { text: `x + ${a} = ${neg(b)}`, answer: x }; }
    if (t === 1) { const b = x - a; return { text: `x − ${a} = ${neg(b)}`, answer: x }; }
    if (t === 2) return { text: `${a}x = ${neg(a * x)}`, answer: x };
    return { text: `x ÷ ${a} = ${neg(x)}`, answer: x * a };
  } },
  two: { name: "Two-step equations", kind: "eq", gen(lvl) {
    const x = lvl === 0 ? rint(1, 12) : nz(-12, 12), a = rint(2, 9), b = lvl === 0 ? rint(1, 30) : nz(-30, 30);
    return { text: `${a}x${signed(b)} = ${neg(a * x + b)}`, answer: x };
  } },
  both: { name: "x on both sides", kind: "eq", gen() {
    const x = nz(-10, 10); let a, c; do { a = rint(2, 12); c = rint(1, 11); } while (a === c);
    const b = nz(-20, 20), d = a * x + b - c * x;
    return { text: `${a}x${signed(b)} = ${c === 1 ? "" : c}x${signed(d)}`, answer: x };
  } },
  pct: { name: "Percents", kind: "arith", gen(lvl) {
    const gcd = (a, b) => b ? gcd(b, a % b) : a;
    const p = pick(lvl === 0 ? [10, 50, 25] : [5, 10, 15, 20, 25, 30, 40, 60, 75, 80]);
    const step = 100 / gcd(p, 100), n = step * rint(1, Math.max(1, Math.floor((lvl === 0 ? 100 : 400) / step)));

const BASES = [[63.6, 63.6], [0, 127.3], [-63.6, 63.6]];
const fence = a => 330 + 70 * (1 - Math.pow(Math.min(1, Math.abs(a) / 45), 1.6));

const K = 0.0013, WALL_H = 10;

    vx -= K * sp * vx * dt; vy -= K * sp * vy * dt; vz += (-32.2 - K * sp * vz) * dt;
    x += vx * dt; y += vy * dt; z += vz * dt; t += dt;

      else if (!hr) { const nx = x / d, ny = y / d, dot = vx * nx + vy * ny; if (dot > 0) { vx -= 1.6 * dot * nx; vy -= 1.6 * dot * ny; wall = true; } }
    }
    if (z <= 0) {
      z = 0;
      if (!landed) landed = { x, y, t, d };
      if (opts.noWall) break;

      case "triple": ev = rnd(101, 108); la = rnd(14, 20); sp = pick([-1, 1]) * rnd(34, 42); break;
      case "double": ev = rnd(97, 106); la = rnd(13, 22); sp = pick([-1, 1]) * rnd(16, 36); break;
      case "single": if (Math.random() < 0.5) { ev = rnd(86, 98); la = rnd(8, 14); sp = rnd(-35, 35); } else { ev = rnd(92, 104); la = rnd(1, 6); sp = pick([-28, -22, -5, 5, 22, 28]) + rnd(-2, 2); } break;

    const t = u * f.dur; let i = Math.min(pts.length - 1, Math.floor(t * 120));
    scene.ball = { ...pts[i], trail: pts.slice(Math.max(0, i - 24), i + 1).filter((_, j) => j % 3 === 0) };
    if (target) { const reach = clamp(u * (f.caught ? 1 : 1.15), 0, 1); fl.x = sx + (target.x - sx) * reach; fl.y = sy + (target.y - sy) * reach; }
  });
  if (f.caught) {
    sfx.pop();
    if (con.outcome === "groundout" || con.outcome === "dp" || con.outcome === "weak") {
      const from = { ...scene.ball }, to = { x: 63.6, y: 63.6, z: 5 };
      await anim(450, u => { scene.ball = { x: from.x + (to.x - from.x) * u, y: from.y + (to.y - from.y) * u, z: 4 + Math.sin(u * Math.PI) * 6 }; });

/** Runners advance; returns runs scored. */
function advance(kind) {
  const b = G.bases; let runs = 0;
  if (kind === "bb") {
    if (b[0]) { if (b[1]) { if (b[2]) runs++; b[2] = true; } b[1] = true; }
    b[0] = true; return runs;
  }
  const n = { single: 1, double: 2, triple: 3, hr: 4 }[kind];
  const nb = [false, false, false];
  for (let i = 2; i >= 0; i--) {
    if (!b[i]) continue;
    let to = i + 1 + n;
    if (n === 1 && i === 1 && Math.random() < 0.6) to++;
    if (n === 2 && i === 0 && Math.random() < 0.45) to++;
    if (to >= 4) runs++; else nb[to - 1] = true;
  }
  if (n === 4) runs++; else nb[n - 1] = true;
  G.bases = nb; return runs;
}
function score(side, runs) { if (runs > 0) { G[side] += runs; } }

function hitOutcome(qv) {
  // Home runs mostly come from answering in the first fifth of the clock.
  const table = qv >= 0.8 ? [["hr", 35], ["triple", 5], ["double", 20], ["single", 20], ["flyout", 12], ["groundout", 8]]
    : qv >= 0.6 ? [["hr", 14], ["triple", 4], ["double", 18], ["single", 26], ["flyout", 20], ["groundout", 18]]
    : qv >= 0.35 ? [["hr", 4], ["triple", 2], ["double", 12], ["single", 30], ["flyout", 25], ["groundout", 27]]
    : [["hr", 1], ["double", 6], ["single", 22], ["flyout", 28], ["groundout", 33], ["foul", 10]];
  let r = Math.random() * 100;
  for (const [o, w] of table) { r -= w; if (r <= 0) return o; }
  return "single";
}
function recordQ(q, ok, ms) {
  if (ok && ms) { const T = P.times || (P.times = {}), t = T[q.kind] || (T[q.kind] = []); t.push(Math.round(ms / q.mult)); if (t.length > 15) t.shift(); }
  const s = P.skills[q.skill] || (P.skills[q.skill] = { n: 0, ok: 0 });
  s.n++; if (ok) s.ok++;
  if (ok) { G.streak++; prog("streak", G.streak, true); } else G.streak = 0;
}
const LABEL = { single: "SINGLE", double: "DOUBLE!", triple: "TRIPLE!!", hr: "HOME RUN!", flyout: "FLY OUT", popout: "POP OUT", groundout: "GROUND OUT", dp: "DOUBLE PLAY", weak: "WEAK GROUNDER" };

/* ---------- you bat */
async function plateAppearance() {
  G.balls = 0; G.strikes = 0; hud();
  for (;;) {
    await windup();
    const inZone = Math.random() < (G.balls === 3 ? 0.78 : 0.66);
    let loc;
    if (inZone) loc = { u: rnd(-0.85, 0.85), v: rnd(-0.85, 0.85) };
    else { const side = rint(0, 3); loc = side < 2 ? { u: (side ? 1 : -1) * rnd(1.4, 1.9), v: rnd(-1, 1) } : { u: rnd(-1, 1), v: (side === 2 ? 1 : -1) * rnd(1.3, 1.5) }; }
    const q = nextQ(), mph = rint(84, 94) + LEAGUES[G.league].lvl * 2;
    showQ(q, `${G.balls}-${G.strikes} count · ${mph} mph · Strike → solve & SWING · Ball → TAKE`, loc, "bat");
    const r = await waitInput(q.T, true);
    hideQ();
    const swing = r.type === "answer";
    if (swing) recordQ(q, r.ok, r.ms);
    await pitchFlight(loc, swing);
    // decide the pitch
    let outcome = null;
    if (r.type === "answer" && r.ok) {
      const qv = 1 - r.frac;
      if (inZone) outcome = hitOutcome(qv);
      else { const x = Math.random(); outcome = x < 0.5 ? "foul" : x < 0.85 ? "weak" : "single"; }
      if (outcome === "foul") {
        sfx.crack(0.2); const con = makeContact("foul"); await ballInPlay(con);
        if (G.strikes < 2) G.strikes++;
        hud(); await banner("FOUL BALL", inZone ? "Get there faster" : "You chased a ball", "#94a3b8", 900); continue;
      }
      sfx.crack(qv);
      const con = makeContact(outcome);
      if (outcome === "hr") scene.flash = 0.5;
      await ballInPlay(con);
      return finishPA(outcome, con, qv);
    }
    await toMitt();
    if (r.type === "answer") {
      G.strikes++; sfx.ump();
      if (G.strikes >= 3) return finishPA("k", null, 0, `Swing and a miss. It was ${neg(q.answer)}.`);
      hud(); await banner(`STRIKE ${G.strikes}`, `Swinging. It was ${neg(q.answer)}.`, "#fbbf24", 1500); continue;
    }
    if (inZone) {
      G.strikes++; sfx.ump();
      const why = r.type === "timeout" ? `Too slow. It was ${neg(q.answer)}.` : "That one was in the zone.";
      if (G.strikes >= 3) return finishPA("k", null, 0, `Called strike three. ${why}`);
      hud(); await banner(`STRIKE ${G.strikes}`, why, "#fbbf24", 1400); continue;
    }
    G.balls++;
    if (G.balls >= 4) return finishPA("bb");
    hud(); await banner(`BALL ${G.balls}`, r.type === "take" ? "Good eye" : "", "#4ade80", 900);
  }
}
async function finishPA(o, con, qv, subK) {
  const c = P.car, ln = G.line;
  c.pa++;
  if (o === "bb") {
    c.bb++; ln.bb++; const runs = advance("bb"); score("me", runs); c.rbi += runs; ln.rbi += runs; addXP(10 + runs * 10); prog("walk", 1);
    hud(); sfx.cheer(0.5, 1); return banner("BALL FOUR", runs ? "Walked in a run!" : "Take your base", "#4ade80", 1200);
  }
  c.ab++; ln.ab++;
  if (o === "k") { c.k++; ln.k++; G.outs++; sfx.groan(); hud(); return banner("STRIKEOUT", subK, "#f87171", 1700); }
  if (["single", "double", "triple", "hr"].includes(o)) {
    c.h++; ln.h++; prog("hits", 1);
    if (o !== "single") { prog("xbh", 1); c[o === "double" ? "d" : o === "triple" ? "t" : "hr"]++; ln[o === "double" ? "d" : o === "triple" ? "t" : "hr"]++; }
    const runs = advance(o); score("me", runs); c.rbi += runs; ln.rbi += runs;
    addXP({ single: 15, double: 25, triple: 40, hr: 60 }[o] + runs * 10);
    let sub = `${Math.round(con.ev)} mph · ${Math.round(con.la)}° · ${con.dist} ft`;
    if (runs) sub += ` · ${runs} RBI`;
    hud();
    if (o === "hr") {
      prog("hr2", 1); if (con.dist >= 420) prog("bomb", 1);
      if (con.dist > c.longest) { c.longest = con.dist; sub += " · NEW LONGEST!"; }
      fireworks(P.eq.fx); sfx.song(P.eq.song); sfx.cheer(1.4, 3);
      return banner(runs === 4 ? "GRAND SLAM!" : "HOME RUN!", sub, "#ffc940", 2600);
    }
    sfx.cheer(o === "single" ? 0.6 : 1, 1.8);
    return banner(LABEL[o], (qv >= 0.75 ? "BARRELED · " : "") + sub, "#4ade80", 1700);
  }
  // in-play out
  let outs = 1, runs = 0, label = LABEL[o];
  if (o === "flyout" && G.bases[2] && G.outs < 2 && Math.random() < 0.55) { G.bases[2] = false; runs = 1; label = "SAC FLY"; }
  if ((o === "groundout" || o === "weak") && G.bases[0] && G.outs < 2 && Math.random() < 0.3) { outs = 2; label = "DOUBLE PLAY"; G.bases[0] = false; }
  else if (o === "groundout" || o === "weak") { const forced = G.bases[0]; if (forced) { if (G.bases[1]) G.bases[2] = true; G.bases[1] = true; G.bases[0] = false; } }
  G.outs += outs;
  if (G.outs < 3) { score("me", runs); c.rbi += runs; ln.rbi += runs; } else runs = 0;
  sfx.groan(); hud();
  return banner(label, runs ? "Run scores!" : `${Math.round(con.ev)} mph · ${con.dist} ft`, "#94a3b8", 1400);
}

/* ---------- you field */
async function defendBatter() {
  await windup();
  const q = nextQ();
  showQ(q, `🧤 ${LEAGUES[G.league].opp} batting · solve it to make the play`, null, "field");
  const r = await waitInput(q.T, false);
  hideQ();
  if (r.type === "answer") recordQ(q, r.ok, r.ms);
  // A slow right answer can still leave a bloop single.
  const ok = r.type === "answer" && r.ok && !(1 - r.frac < 0.3 && Math.random() < 0.5);
  if (ok) {
    const x = Math.random();
    if (x < 0.3) { scene.swing = null; await pitchFlight({ u: 0, v: 0 }, true); await toMitt(); G.outs++; sfx.ump(); addXP(10); hud(); return banner("STRIKE THREE", "Rung him up", "#4ade80", 1200); }
    const o = G.bases[0] && G.outs < 2 && 1 - r.frac >= 0.6 && Math.random() < 0.35 ? "dp" : x < 0.65 ? "groundout" : "flyout";
    await pitchFlight({ u: 0, v: 0 }, true); sfx.crack(0.3);
    await ballInPlay(makeContact(o));
    let outs = o === "dp" ? 2 : 1, runs = 0;
    if (o === "dp") G.bases[0] = false;
    if (o === "flyout" && G.bases[2] && G.outs < 2 && Math.random() < 0.4) { G.bases[2] = false; runs = 1; }
    G.outs = Math.min(3, G.outs + outs);
    if (G.outs < 3) { score("cpu", runs); G.halfRuns += runs; }
    addXP(10 * outs); sfx.cheer(0.6, 1.2); hud();
    return banner(o === "dp" ? "DOUBLE PLAY!" : "OUT!", runs ? "Sac fly, run scores" : "Nice play", "#4ade80", 1200);
  }
  const x = Math.random(), o = x < 0.55 ? "single" : x < 0.8 ? "double" : x < 0.85 ? "triple" : "hr";
  await pitchFlight({ u: rnd(-0.6, 0.6), v: rnd(-0.6, 0.6) }, true); sfx.crack(0.6);
  const con = makeContact(o); await ballInPlay(con);
  const runs = advance(o); score("cpu", runs); G.halfRuns += runs; G.allowedHit = true;
  sfx.groan(); hud();
  const why = r.type === "timeout" ? `Too slow. It was ${neg(q.answer)}.` : r.ok ? "Right answer, but a step too slow." : `It was ${neg(q.answer)}.`;
  return banner(LABEL[o], why + (runs ? ` ${runs} run${runs > 1 ? "s" : ""} in.` : ""), "#f87171", 1700);
}

/* =====================================================================
   Game flow
   ===================================================================== */
const RUN_RULE = 5;
async function halfInning(half) {
  G.half = half; G.outs = 0; G.bases = [false, false, false]; G.halfRuns = 0; G.myRuns = 0; G.allowedHit = false; G.balls = 0; G.strikes = 0;
  resetFielders(); hud();
  await banner(`${half === "top" ? "TOP" : "BOTTOM"} ${G.inning}`, half === "top" ? "Take the field" : "You're up", "#60a5fa", 1300);
  if (half === "top") {
    while (G.outs < 3) {
      await defendBatter();
      if (G.halfRuns >= RUN_RULE && G.outs < 3) { await banner("INNING OVER", `${RUN_RULE}-run limit`, "#94a3b8", 1300); break; }
    }
    if (!G.allowedHit && G.halfRuns === 0) prog("clean", 1);
  } else {
    while (G.outs < 3) {
      const before = G.me;
      await plateAppearance();
      if (G.inning >= G.innings && G.me > G.cpu) { G.walkoff = true; break; }
      G.myRuns = (G.myRuns || 0) + G.me - before;
      if (G.myRuns >= RUN_RULE && G.outs < 3) { await banner("SIDE RETIRED", `${RUN_RULE}-run limit. Take the field!`, "#94a3b8", 1400); break; }
    }
  }
}
async function playGame() {
  for (G.inning = 1; ; G.inning++) {
    await halfInning("top");
    if (G.inning >= G.innings && G.me > G.cpu) break;
    await halfInning("bot");
    if (G.walkoff) { fireworks(P.eq.fx); sfx.cheer(1.5, 3.5); await banner("WALK-OFF!", "Ballgame!", "#ffc940", 2600); break; }
    if (G.inning >= G.innings && G.me !== G.cpu) break;
    if (G.inning >= G.innings + 3) break;
  }
  endGame();
}
async function playDerby() {
  G.half = "bot"; hud();
  await banner("HOME RUN DERBY", "10 outs. Every pitch is a strike.", "#ffc940", 1700);
  while (G.outs < 10) {
    await windup();
    const q = nextQ();
    showQ(q, `Derby · ${10 - G.outs} outs left · fast answers go farther`, null, "derby");
    const r = await waitInput(q.T, false);
    hideQ();
    if (r.type === "answer") recordQ(q, r.ok, r.ms);
    await pitchFlight({ u: 0, v: 0 }, r.type === "answer");
    if (r.type === "answer" && r.ok) {
      const qv = 1 - r.frac, hr = qv >= 0.65 || (qv >= 0.4 ? Math.random() < 0.5 : Math.random() < 0.15);
      const con = makeContact(hr ? "hr" : "flyout");

      await ballInPlay(con);
      if (hr) {
        G.hr++; G.total += con.dist; addXP(25); P.car.hr++; prog("hr2", 1); if (con.dist >= 420) prog("bomb", 1);
        let sub = `${con.dist} ft`;
        if (con.dist > G.longest) G.longest = con.dist;
        if (con.dist > P.car.longest) { P.car.longest = con.dist; sub += " · NEW LONGEST!"; }
        fireworks(P.eq.fx); sfx.cheer(1, 1.6); hud();

    }

      const locked = i.tier > t, eq = P.eq[cat] === i.id;
      const sw = i.c ? `<div class="sw" style="background:${i.a ? `linear-gradient(135deg, ${i.c} 60%, ${i.a} 60%)` : i.c}"></div>`
        : i.fx ? `<div class="sw" style="background:${i.fx === "rainbow" ? "linear-gradient(90deg,#f87171,#fbbf24,#4ade80,#60a5fa,#a78bfa)" : `linear-gradient(90deg, ${i.fx.join(",")})`}"></div>`
        : `<div class="sw" style="display:flex;align-items:center;justify-content:center;font-size:20px;background:#0b1527">${cat === "song" ? "🎵" : "🏷️"}</div>`;
      h += `<button class="btn item ${locked ? "locked" : ""} ${eq ? "eq" : ""}" data-it="${i.id}" ${locked ? "disabled" : ""}>${sw}${i.name}<br><small style="color:var(--dim)">${locked ? `🔒 Tier ${i.tier}` : eq ? "Equipped" : cat === "song" ? "Tap to equip + hear" : "Tap to equip"}</small></button>`;
    }
    h += `</div>`;
  }
  $("#lockerBody").innerHTML = h;
  $("#lockerBody").querySelectorAll("[data-it]").forEach(b => b.onclick = () => { const i = item(b.dataset.it); P.eq[i.cat] = i.id; save(); if (i.cat === "song") sfx.song(i.id); lockerScreen(); });
  show("sLocker");
}
$("#lockerBtn").onclick = lockerScreen;

const f3 = x => isFinite(x) ? x.toFixed(3).replace(/^0/, "") : ".000";
function statsScreen() {
  const c = P.car, tb = c.h + c.d + 2 * c.t + 3 * c.hr;
  const avg = c.h / c.ab, obp = (c.h + c.bb) / c.pa, slg = tb / c.ab;
  let h = `<div class="card"><h3>CAREER BATTING</h3><table class="stats"><tr>${["PA", "AB", "H", "2B", "3B", "HR", "RBI", "BB", "K", "AVG", "OBP", "SLG", "OPS"].map(x => `<th class="n">${x}</th>`).join("")}</tr>
    <tr>${[c.pa, c.ab, c.h, c.d, c.t, c.hr, c.rbi, c.bb, c.k, f3(avg), f3(obp), f3(slg), f3((obp || 0) + (slg || 0))].map(x => `<td class="n">${x}</td>`).join("")}</tr></table>
    <div style="margin-top:10px;font-weight:800;color:var(--dim)">Record ${c.w}-${c.l} · Longest HR ${c.longest || 0} ft</div></div>`;
  const rows = Object.entries(P.skills).filter(([id]) => SKILLS[id]).sort((a, b) => b[1].n - a[1].n);
  h += `<div class="card" style="margin-top:14px"><h3>MATH BY SKILL</h3><table class="stats"><tr><th>Skill</th><th class="n">Tries</th><th class="n">Right</th></tr>
    ${rows.map(([id, s]) => `<tr><td>${SKILLS[id].name}</td><td class="n">${s.n}</td><td class="n">${Math.round(s.ok / s.n * 100)}%</td></tr>`).join("") || `<tr><td colspan="3" style="color:var(--dim)">Play a game to see this.</td></tr>`}</table></div>`;
  $("#statsBody").innerHTML = h;
  show("sStats");
}
$("#statsBtn").onclick = statsScreen;

function flexScreen() {
  const rows = players.list.map(p => ({ p, s: loadP(p.id) })).sort((a, b) => b.s.xp - a.s.xp);
  const derbyBest = s => { for (const id of ["hof", "majors", "minors", "rookie", "sandlot"]) { const d = s.car.derby[id]; if (d) return `${d.hr} HR <small style="color:var(--dim)">(${LEAGUES[id].name})</small>`; } return "—"; };
  $("#flexBody").innerHTML = `<div class="card"><table class="stats"><tr><th>#</th><th>Player</th><th>Title</th><th class="n">Tier</th><th class="n">AVG</th><th class="n">HR</th><th class="n">Longest</th><th class="n">Derby best</th><th class="n">W-L</th></tr>
    ${rows.map(({ p, s }, i) => { const c = s.car; return `<tr><td>${["🥇", "🥈", "🥉"][i] || i + 1}</td><td>${esc(p.name)}</td><td>${item(s.eq.title).name}</td><td class="n">${tierOf(s.xp)}</td><td class="n">${f3(c.h / c.ab)}</td><td class="n">${c.hr}</td><td class="n">${c.longest ? c.longest + " ft" : "—"}</td><td class="n">${derbyBest(s)}</td><td class="n">${c.w}-${c.l}</td></tr>`; }).join("")}
    </table></div>`;
  show("sFlex");
}
$("#flexBtn").onclick = flexScreen;

/* ---------- boot */
resize();
requestAnimationFrame(loop);
if (document.fonts) document.fonts.ready.then(drawStadium);
menu();
window.__fc = { G, SKILLS, LEAGUES, makeContact, flight, get q() { return curQ; }, get P() { return P; }, press, get pending() { return pending; } };
</script>
</body>
</html>
